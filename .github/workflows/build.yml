name: Build and Release Module

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Install build-tools, platform and NDK
        run: |
          SDKMANAGER=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -1)
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --install "platforms;android-37" "build-tools;37.0.0" "ndk;29.0.14206865"

      - name: Build module with Gradle
        run: |
          chmod +x ./gradlew
          ./gradlew :module:assembleModule --no-daemon --stacktrace

      - name: Collect artifact
        run: |
          mkdir -p output
          cp module/build/outputs/module/*.zip output/LinkToWindows_v1.0-test.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: module-zip
          path: output/*.zip

  release:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: module-zip
          path: output

      - name: Generate release notes
        run: |
          {
            echo "## 🤖 AI 编译测试"
            echo ""
            echo "本版本由超级小爱 AI 通过 GitHub Actions 云端自动编译打包，仅作测试用途，请勿用于生产环境。"
            echo ""
            echo "## 版本信息"
            echo "- 版本号：v1.0-test（1.0 测试版）"
            echo "- 模块内部版本：v1.4 (versionCode 14)"
            echo "- 构建产物：LinkToWindows_v1.0-test.zip"
            echo "- 构建时间：$(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo "- 构建环境：ubuntu-latest / JDK 21 / NDK 29.0.14206865 / Build Tools 37.0.0"
            echo "- 构建命令：./gradlew :module:assembleModule"
            echo ""
            echo "## 变更内容（提交日志）"
            echo '```'
            git log --pretty=format:"%h %s" -n 30
            echo ''
            echo '```'
            echo ""
            echo "## 构建日志"
            echo "完整编译日志见 GitHub Actions 运行记录（Actions → Build and Release Module）。"
          } > release_body.md
          cat release_body.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0-test
          name: "v1.0-test (AI 编译测试)"
          prerelease: true
          body_path: release_body.md
          files: output/*.zip
