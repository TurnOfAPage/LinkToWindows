name: Build and Release Module

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Install build-tools, platform and NDK
        run: |
          SDKMANAGER=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -1)
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          if ! "$SDKMANAGER" --channel=3 --install "platforms;android-37.0" "build-tools;37.0.0" "ndk;29.0.14206865"; then
            echo "=== Install failed. Available matching packages: ==="
            "$SDKMANAGER" --list --channel=3 | grep -E "platforms;android-3[5-9]|build-tools;3[5-9]|ndk;2[89]" || true
            exit 1
          fi

      - name: Build module with Gradle
        run: |
          chmod +x ./gradlew
          ./gradlew :module:generateFetcherHeader --no-daemon
          ./gradlew :module:assembleModule --no-daemon --stacktrace

      - name: Collect artifact
        run: |
          mkdir -p output
          cp module/build/outputs/module/*.zip output/LinkToWindows_v1.1-test.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: module-zip
          path: output/*.zip

  release:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: module-zip
          path: output

      - name: Generate release notes
        run: |
          {
            echo "## 🤖 AI 编译测试"
            echo ""
            echo "本版本由超级小爱 AI 通过 GitHub Actions 云端自动编译打包，仅作测试用途，请勿用于生产环境。"
            echo ""
            echo "## 版本信息"
            echo "- 版本号：v1.1-test（1.1 测试版）"
            echo "- 构建产物：LinkToWindows_v1.1-test.zip"
            echo "- 构建时间：$(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo "- 构建环境：ubuntu-latest / JDK 21 / NDK 29.0.14206865 / Build Tools 37.0.0"
            echo "- 构建命令：./gradlew :module:generateFetcherHeader && ./gradlew :module:assembleModule"
            echo ""
            echo "## 本次变更"
            echo "- 更新 zygisk.hpp 到官方最新 ZYGISK_API_VERSION 5（KernelSU / LSPosed ZygiskNext / Magisk Zygisk 共用 API，兼容 v4 模块接口）"
            echo "- 支持架构检查：zygisk/arm64-v8a.so、injectrc、virtual_keyboard 均为 arm64 (aarch64)，无冗余架构，保持 arm64-v8a"
            echo ""
            echo "## 变更内容（提交日志）"
            echo '```'
            git log --pretty=format:"%h %s" -n 30
            echo ''
            echo '```'
            echo ""
            echo "## 构建日志"
            echo "完整编译日志见 GitHub Actions 运行记录（Actions → Build and Release Module）。"
          } > release_body.md
          cat release_body.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1-test
          name: "v1.1-test (AI 编译测试)"
          prerelease: true
          body_path: release_body.md
          files: output/*.zip
